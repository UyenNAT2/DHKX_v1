<!doctype html>

    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch has both a getter and setter so injected scripts/extensions can wrap fetch without throwing 'Cannot set property fetch of #<Window> which has only a getter'
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            }
          });

          if (typeof window !== 'undefined' && window.Window && window.Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
              if (protoDesc && !protoDesc.set && protoDesc.configurable) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  }
                });
              }
            } catch (e) {}
          }
        } catch (e) {}

        // Prevent extension errors from breaking application lifecycle
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(e) {
            if (
              (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
